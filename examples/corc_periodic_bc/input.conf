mesh
{
	file : corc.msh ;
	unit : mm ;
}

solver
{
	linear
	{
		library : strumpack ;
	}

	nonlinear
	{
		tolerance         : 1e-7 ;
		max iterations    : 100 ;
		target iterations : 50 ;
		algorithm         : Picard ;
		stall tolerance   : 0.001 ;
		watchdog window   : 0 ;
	}

	timestep
	{
		initial timestep       : 0.001 ms ;
		maximum timestep       : 0.01 ms ;
		simulation time        : 20 ms ;
		adapt timestep         : true ;
		save every             : 0.1 ms ;
		anderson stabilization : false ;
		scheme                 : bdf5 ;
	}
}


materials
{
	ybco
	{
		builtin          : ybco ;
		jc               : 4e10 A/m^2 ;
		n                : 25 ;
		ec               : 1e-4 V/m ;
		resistivity type : power-law ;
	}
}

layers : tape
{
	ybco : 0.1 mum ;
	ybco : 0.1 mum ;
	ybco : 0.1 mum ;
	ybco : 0.1 mum ;
	ybco : 0.1 mum ;
	ybco : 0.1 mum ;
	ybco : 0.1 mum ;
	ybco : 0.1 mum ;
	ybco : 0.1 mum ;
	ybco : 0.1 mum ;
}

homology
{
	algorithm : generalized pellikka ;
}


topology
{
	thinshell : tape
	{
		sidesets : 27,31,39,43,51,55 ;
	}

	air
	{
		blocks : 1:2 ;
	}

	curves
	{
		1  : 1 @ 27 ;
		2  : 1 @ 31 ;
		3  : 1 @ 39 ;
		4  : 1 @ 43 ;
		5  : 1 @ 51 ;
		6  : 1 @ 55 ;
		7  : 60 @ 27 ;
		8  : 60 @ 31 ;
		9  : 60 @ 39 ;
		10 : 60 @ 43 ;
		11 : 60 @ 51 ;
		12 : 60 @ 55 ;
	}

	periodic
	{
		source : 2, 3, 4 ;
		target : 186, 179, 181 ;
	}
}

boundary conditions
{
	current
	{
		input curves  : [1,2] ;
		output curves : [7,8] ;
		type          : sine ;
		amplitude     : 160 A ;
		frequency     : 50 Hz ;
		phase         : 0 deg ;
	}
}
