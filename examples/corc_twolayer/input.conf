mesh
{
	file : corc.msh ;
	unit : mm ;
}

solver
{
	linear magnetic
	{
		library              : mumps ;
		krylov method        : auto ;
		compression scheme   : off ;
		relative tolerance   : 1e-10 ;
		compute conditioning : off ;
	}

	nonlinear magnetic
	{
		tolerance : 1e-9 ;
		max iterations    : 60 ;
		min iterations    : 2 ;
		target iterations : 6 ;
		min relaxation    : 0.01 ;
		algorithm         : Newton ;
		watchdog window   : 8 ;
	}


	timestep
	{
		initial timestep       : 0.01 s ;
		minimum timestep       : 0.001 ms ;
		maximum timestep       : 0.1 s ;
		simulation time        : 15 s ;
		adapt timestep         : true ;
		save every             : 0.1 s ;
		method                 : bdf5 ;
		anderson stabilization : on ;
	}

	//linear thermal
	//{
	//     library : petsc ;
	//    preconditioner : asm ;
	// }

	//nonlinear thermal
	//{
	//    tolerance      : 1e-7 ;
	//    max iterations : 15 ;
	//    min iterations : 2 ;
	//    max relaxation : 1.0 ;
	//    min relaxation : 0.01 ;
	//    tolerance switch : 1e-4 ;
	//    algorithm : Newton ;
	//    coupling : fully coupled ;
	//    watchdog window : 8 ;
	//}
}


materials
{
	ybco
	{
		builtin          : ybco ;
		jc               : 1e10 A/m^2 ;
		n                : 20 ;
		ec               : 1e-4 V/m ;
		resistivity type : power-law ;
	}

	copper
	{
		builtin : copper ;
		RRR     : 50 ;
	}

	silver
	{
		builtin : silver ;
		RRR     : 20 ;
	}
	hastelloy
	{
		builtin : hastelloy ;
	}

	buffer
	{
		builtin : magnesia ;
	}
}

layers : tape
{
	copper    : 20 mum ;
	silver    : 2 mum ;
	ybco      : 1.6 mum ;
	buffer    : 0.2 mum ;
	hastelloy : 50 mum ;
	silver    : 1.8 mum ;
	copper    : 20 mum ;
}

homology
{
	algorithm : generalized pellikka ;
}


topology
{
	thinshell : tape
	{
		sidesets : 4:9 ;
	}

	air
	{
		blocks : 1:3 ;
	}

	curves
	{
		1  : 12 @ 4 ;
		2  : 11 @ 4 ;
		3  : 12 @ 5 ;
		4  : 11 @ 5 ;
		5  : 12 @ 6 ;
		6  : 11 @ 6 ;
		7  : 12 @ 7 ;
		8  : 11 @ 7 ;
		9  : 12 @ 8 ;
		10 : 11 @ 8 ;
		11 : 12 @ 9 ;
		12 : 11 @ 9 ;
	}

	periodic
	{
		source : 2, 3, 4 ;
		target : 7, 8, 9 ;
	}
}

initial conditions
{
	temperature : 77 K ;
}

boundary conditions
{
	current
	{
		input curves  : [1],[3],[5],[7],[9],[11] ;
		output curves : [2],[4],[6],[8],[10],[12] ;
		type          : ramp ;
		amplitude     : 200 A ;
		period        : 10 s ;
		offset        : -0.01 s ;
	}
}
