mesh
{
	file : gantry.msh ;
	unit : mm ;
}

solver
{
	linear
	{
		library : strumpack ;
	}

	nonlinear
	{
		tolerance         : 1e-7 ;
		max iterations    : 100 ;
		target iterations : 20 ;
		algorithm         : Newton ;
	}

	timestep
	{
		initial timestep : 100 ms ;
		maximum timestep : 500 ms ;
		simulation time  : 15 s ;
		adapt timestep   : true ;
		save every       : 500 ms ;
		scheme           : bdf5 ;
		// restart          : false ;
	}
}

homology
{
	algorithm : generalized pellikka ;
}

initial conditions
{
	temperature : 12 K ;
}

materials
{
	bscco
	{
		builtin          : ybco ;
		file             : bscco-2223.hdf5 ;
		resistivity type : riva ;
	}

	iron
	{
		builtin ;
		bhfile  : bhdata.hdf5 ;
		curve   : SAE1010 ;
	}
}

layers : tape
{
	bscco : 310 mum ;
}

