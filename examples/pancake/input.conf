//---------------------------------------------------------------
// BELFEM INPUTFILE
// Berkeley Lab
//---------------------------------------------------------------

mesh
{
	file : pancake.msh ;
	unit : mm ;
}

solver
{

	linear magnetic
	{

		library              : mumps ;
		compute conditioning : true ;
		compression scheme   : off ;
		relative tolerance   : 1e-10 ;
	}

	nonlinear magnetic
	{
		tolerance         : 1e-9 ;
		max iterations    : 30 ;
		target iterations : 6 ;
		min relaxation    : 0.01 ;
		algorithm         : Newton ;
		watchdog window   : 8 ;
	}

	timestep
	{
		initial timestep       : 50 ms ;
		minimum timestep       : 0.1 ns ;
		maximum timestep       : 50 ms ;
		simulation time        : 10 s ;
		adapt timestep         : true ;
		save every             : 50 ms ;
		anderson stabilization : on ;
		method                 : bdf5 ;
	}
}


initial conditions
{
	temperature : 20 K ;
}


materials
{
	ybco
	{
		builtin          : ybco ;
		file             : superox.hdf5 ;
		resistivity type : riva ;
	}

	copper
	{
		builtin : copper ;
		RRR     : 50 ;
	}

	silver
	{
		builtin : silver ;
		RRR     : 10 ;
	}
	solder
	{
		builtin            : Pb38Sn62 ;
		RRR                : 1.5 ;
		density correction : 0.044 ;
	}
	hastelloy
	{
		builtin : hastelloy ;
	}

	buffer
	{
		builtin : magnesia ;
	}
}

layers : tape
{
	copper    : 50 mum ;
	silver    : 2 mum ;
	ybco      : 1   mum ;
	buffer    : 0.2 mum ;
	hastelloy : 50 mum ;
	silver    : 2 mum ;
	copper    : 50 mum ;
}

homology
{
	algorithm : generalized pellikka ;
}


topology
{
	thinshell : tape
	{
		sidesets : -9, 10:16 ;
	}

	air
	{
		block : 1 ;
	}

	conductor : solder
	{
		blocks   : 2:8 ;
		material : solder ;
	}

	curves
	{
		1  : 21 @  9 ;   // tape 1, inner end
		2  : 21 @ 10 ;   // tape 2, inner end
		3  : 22 @ 11 ;   // tape 3, inner end
		4  : 23 @ 12 ;   // tape 4, inner end
		5  : 24 @ 13 ;   // tape 5, inner end
		6  : 25 @ 14 ;   // tape 6, inner end
		7  : 26 @ 15 ;   // tape 7, inner end
		8  : 27 @ 16 ;   // tape 8, inner end
		9  : 28 @  9 ;   // tape 1, outer end
		10 : 28 @ 10 ;   // tape 2, outer end
		11 : 29 @ 11 ;   // tape 3, outer end
		12 : 30 @ 12 ;   // tape 4, outer end
		13 : 31 @ 13 ;   // tape 5, outer end
		14 : 32 @ 14 ;   // tape 6, outer end
		15 : 33 @ 15 ;   // tape 7, outer end
		16 : 34 @ 16 ;   // tape 8, outer end
	}

	periodic
	{
		source : 1, 2, 3 ;
		target : 4, 5, 6 ;
	}
}

initial conditions
{
	temperature : 20 K ;
}

boundary conditions
{
	current
	{
		input terminals  : [21:27] ;
		output terminals : [28:34] ;
		type             : sigmoid ;
		amplitude        : 10 kA ;
		period           : 10 s ;
		offset           : -0.01 s ;
		fuzzyness        : 1e-4 ;
	}
}
