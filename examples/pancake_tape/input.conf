//---------------------------------------------------------------
// BELFEM INPUTFILE
// Berkeley Lab
//---------------------------------------------------------------
//
// Single-tape pancake: a 4 mm tape wound 200 times around the z axis
// from r = 7 to 17 mm (turn pitch 50 um). The solder between the turns
// is one solid that touches itself, and the contact surface is the
// tape. The inner lead leaves the spiral on a 3 mm circle into the
// bore, bends hard-way on that small cylinder until it runs along z
// and climbs to the top cap; the outer lead bends easy-way and leaves
// radially to the domain cylinder. Both ride on solder bars whose end
// faces are the terminals. A solder sliver sits inside the first turn;
// solder and tape are cut into half-turn pieces because BELFEM opens
// thin shells block by block.
// The mesh and the topology section below are written by
// python/main.py (pancake_topology.conf).
//
mesh
{
	file : pancake.msh ;
	unit : mm ;
}

solver
{
	linear magnetic
	{
		library              : mumps ;
		krylov method        : auto ;
		compression scheme   : off ;
		relative tolerance   : 1e-10 ;
		compute conditioning : off ;
	}

	nonlinear magnetic
	{
		tolerance         : 1e-9 ;
		max iterations    : 60 ;
		min iterations    : 2 ;
		target iterations : 6 ;
		min relaxation    : 0.01 ;
		algorithm         : Newton ;
		watchdog window   : 8 ;
	}

	timestep
	{
		initial timestep       : 0.01 s ;
		minimum timestep       : 0.001 ms ;
		maximum timestep       : 0.1 s ;
		simulation time        : 15 s ;
		adapt timestep         : true ;
		save every             : 0.1 s ;
		method                 : bdf5 ;
		anderson stabilization : on ;
	}
}

materials
{
	ybco
	{
		builtin          : ybco ;
		file             : superox.hdf5 ;
		resistivity type : riva ;
	}

	copper
	{
		builtin : copper ;
		RRR     : 50 ;
	}

	silver
	{
		builtin : silver ;
		RRR     : 10 ;
	}

	hastelloy
	{
		builtin : hastelloy ;
	}

	buffer
	{
		builtin : magnesia ;
	}

	// the solid between the turns; replace with a usermat entry once
	// the user-defined material exists (see examples/racetrack_usermat)
	solder
	{
		builtin            : Pb38Sn62 ;
		RRR                : 1.5 ;
		density correction : 0.044 ;
	}
}

// placeholder stack that fits the 50 um turn pitch; edit to the tape
layers : tape
{
	copper    : 10  mum ;
	silver    : 1   mum ;
	ybco      : 1   mum ;
	buffer    : 0.2 mum ;
	hastelloy : 30  mum ;
	silver    : 1   mum ;
	copper    : 5   mum ;
}

homology
{
	algorithm : generalized pellikka ;
}

topology
{
	thinshell : tape
	{
		sidesets : 405:807 ;
	}

	// half-turn pieces of the solder between the turns, the sliver
	// inside the first turn (blocks 1:2), and the two lead bars
	// (blocks 402:403)
	conductor : solder
	{
		blocks   : 1:403 ;
		material : solder ;
	}

	air
	{
		block : 404 ;
	}

	// sideset 813 (SolderAir), the solder/air contact, is not listed:
	// BELFEM types it as a conductor-air interface from its two blocks

	// terminal curves: the tape's edges on the bar end faces
	curves
	{
		1 : 808 @ 807 ;   // inner lead piece
		2 : 809 @ 806 ;   // last piece of the outer lead
	}
}

initial conditions
{
	temperature : 77 K ;
}

boundary conditions
{
	current
	{
		input terminals  : 808 ;
		output terminals : 809 ;
		type             : ramp ;
		amplitude        : 100 A ;
		period           : 10 s ;
		offset           : -0.01 s ;
	}
}
