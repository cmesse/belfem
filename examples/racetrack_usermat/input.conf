mesh
{
	file : racetrackAssembly_3coils_19tapes_r2-63.6_r2-58.22_r2-37.5_qcyl.msh ;
	unit : mm ;
}

solver
{
	linear
	{
		library : mumps ;
	}

	nonlinear
	{
		tolerance         : 1.0e-7 ;
		max iterations    : 100 ;
		target iterations : 50 ;
		algorithm         : Newton ;
	}

	timestep
	{
		initial timestep : 1 s ;
		maximum timestep : 5 s ;
		simulation time  : 5000 s ;
		adapt timestep   : true ;
		save every       : 50 s ;
	}
}

materials
{
	hts
	{
		builtin          : ybco ;
		jc               : 1e11 A/m^2 ;
		n                : 30 ;
		ec               : 1e-4 V/m ;
		resistivity type : power-law ;
	}
	bulk
	{
		usermat
		{
			file  : src/build/usermat.so ;
			label : bulk ;
		}
	}
}

homology
{
	algorithm : generalized pellikka ;
}

