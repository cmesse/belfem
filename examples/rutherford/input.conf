//---------------------------------------------------------------
// BELFEM INPUTFILE
// Berkeley Lab
//---------------------------------------------------------------
//
// Five BSCCO tapes wound around a flat Rutherford-type core, one fifth
// of a pitch of an infinite cable. The mesh and the topology section below are
// written by python/main.py; the copper core is not modeled, its
// section is the air block 1.
//
mesh
{
	file : rutherford.msh ;
	unit : mm ;
}

solver
{
	linear magnetic
	{
		library              : mumps ;
		krylov method        : auto ;
		compression scheme   : off ;
		relative tolerance   : 1e-10 ;
		compute conditioning : off ;
	}

	nonlinear magnetic
	{
		tolerance         : 1e-9 ;
		max iterations    : 60 ;
		min iterations    : 2 ;
		target iterations : 6 ;
		min relaxation    : 0.01 ;
		algorithm         : Newton ;
		watchdog window   : 8 ;
	}

	timestep
	{
		initial timestep       : 0.01 s ;
		minimum timestep       : 0.001 ms ;
		maximum timestep       : 0.1 s ;
		simulation time        : 15 s ;
		adapt timestep         : true ;
		save every             : 0.1 s ;
		method                 : bdf5 ;
		anderson stabilization : on ;
	}
}

materials
{
	bscco
	{
		builtin          : ybco ;
		file              : bscco-2223.hdf5 ;
		resistivity type : riva ;
	}
}

layers : tape
{
	bscco : 310 mum ;
}

homology
{
	algorithm : generalized pellikka ;
}

topology
{
	thinshell : tape
	{
		sidesets : 3:7 ;
	}

	// the core section (block 1) is air: the copper core is not modeled
	air
	{
		blocks : 1:2 ;
	}

	// curves: intersection of a cap plane with a tape surface;
	// odd = back plane (10), even = front plane (9)
	curves
	{
		1 : 10 @ 3 ;
		2 : 9 @ 3 ;
		3 : 10 @ 4 ;
		4 : 9 @ 4 ;
		5 : 10 @ 5 ;
		6 : 9 @ 5 ;
		7 : 10 @ 6 ;
		8 : 9 @ 6 ;
		9 : 10 @ 7 ;
		10 : 9 @ 7 ;
	}

	// periodicity: three front quarter points (type-15 elements 2, 3, 4)
	// map to the matching back quarter points (7, 8, 9) by the
	// translation along z; the front cap center (node 1) is not part
	// of the triple
	periodic
	{
		source : 2, 3, 4 ;
		target : 7, 8, 9 ;
	}
}


initial conditions
{
	temperature : 77 K ;
}

boundary conditions
{
	// one condition per conductor, defined on ONE crossing of it: tapes
	// that continue into each other across the periodic planes are one
	// conductor crossing the plane 5 time(s), the current is the same
	// on every crossing, and the amplitude is the tape current
	current
	{
		input curves  : [1] ;
		output curves : [2] ;
		type          : ramp ;
		amplitude     : 30 A ;
		period        : 10 s ;
		offset        : -0.01 s ;
	}
}
