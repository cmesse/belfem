//---------------------------------------------------------------
// BELFEM INPUTFILE
// Berkeley Lab
//---------------------------------------------------------------

mesh
{
	file : tape.msh ;
	unit : mm ;
}

solver
{

	linear magnetic
	{
		library              : mumps ;
		compute conditioning : true ;
		mumps error analysis : false ;
		compression scheme   : off ;
		relative tolerance   : 1e-10 ;
	}

	nonlinear magnetic
	{
		tolerance         : 1e-7 ;
		max iterations    : 30 ;
		target iterations : 6 ;
		min relaxation    : 0.01 ;
		algorithm         : Newton ;
		watchdog window   : 8 ;
	}

	linear thermal
	{
		library              : petsc ;
		compute conditioning : true ;
		preconditioner       : asm ;
	}

	nonlinear thermal
	{
		tolerance        : 1e-7 ;
		max iterations   : 15 ;
		min iterations   : 2 ;
		max relaxation   : 1.0 ;
		min relaxation   : 0.01 ;
		tolerance switch : 1e-4 ;
		algorithm        : Newton ;
		coupling         : fully coupled ;
		watchdog window  : 8 ;
	}

	timestep
	{
		initial timestep       : 5 ms ;
		minimum timestep       : 0.1 ns ;
		maximum timestep       : 20 ms ;
		simulation time        : 1 s ;
		adapt timestep         : true ;
		save every             : 10 ms ;
		anderson stabilization : on ;
		method                 : bdf5 ;
	}
}


initial conditions
{
	temperature : 77 K ;
}


materials
{
	ybco
	{
		builtin          : ybco ;
		file             : sp-ap.hdf5 ;
		resistivity type : riva ;
		defect
		{
			file  : src/build/usermat.so ;
			label : Defect ;
		}
	}

	// REBCO/Ag contact; R_ct is set in src/matlib.cpp
	rint
	{
		usermat
		{
			file  : src/build/usermat.so ;
			label : rint ;
		}
	}

	copper
	{
		builtin : copper ;
		RRR     : 50 ;
	}

	silver
	{
		builtin : silver ;
		RRR     : 10 ;
	}

	hastelloy
	{
		builtin : hastelloy ;
	}

	buffer
	{
		builtin : magnesia ;
	}
}

// rint must keep the thickness rint_h in src/matlib.cpp
layers : tape
{
	copper    : 20 mum ;
	silver    : 2 mum ;
	rint      : 0.1 mum ;
	ybco      : 1.6 mum ;
	buffer    : 0.2 mum ;
	hastelloy : 50 mum ;
	silver    : 1.8 mum ;
	copper    : 20 mum ;
}

homology
{
	algorithm : generalized pellikka ;
}


topology
{
	thinshell : tape
	{
		edge coating : on ;
		sidesets     : 1,2 ;
	}

	air
	{
		blocks : 1:2 ;
	}

	curves
	{
		1 : 1 @ 9 ;     // left half,  z = 0
		2 : 2 @ 9 ;     // right half, z = 0
		3 : 1 @ 11 ;    // left half,  z = 10 mm
		4 : 2 @ 11 ;    // right half, z = 10 mm
	}

	periodic
	{
		source : 2, 3, 5 ;
		target : 9, 10, 12 ;
	}
}

boundary conditions
{
	current
	{
		input curves  : [1,2] ;
		output curves : [3,4] ;
		type          : sigmoid ;
		amplitude     : 150 A ;
		period        : 0.5 s ;
		offset        : 0 s ;
		fuzzyness     : 1e-4 ;
	}
}
