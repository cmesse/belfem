//---------------------------------------------------------------
// BELFEM INPUTFILE
// Berkeley Lab
//---------------------------------------------------------------

mesh
{
	file : tapestack3d.msh ;
	unit : mm ;
}

solver
{

	linear magnetic
	{

		library              : mumps ;
		compute conditioning : true ;
		mumps error analysis : false ;
		compression scheme   : off ;
		relative tolerance   : 1e-10 ;
	}

	nonlinear magnetic
	{
		tolerance         : 1e-7 ;
		max iterations    : 30 ;
		target iterations : 6 ;
		min relaxation    : 0.01 ;
		algorithm         : Newton ;
		watchdog window   : 8 ;

		//coulomb gauge penalty
		// {
		//     chi : 1e-4 ;
		//  }

		//nitsche ghost penalty
		//{
		//    eta   : 4 ;
		//    k_reg : 1e-3 Ohm ;
		// }
	}

	linear thermal
	{
		library              : petsc ;
		compute conditioning : true ;
		preconditioner       : asm ;
	}

	nonlinear thermal
	{
		tolerance        : 1e-7 ;
		max iterations   : 15 ;
		min iterations   : 2 ;
		max relaxation   : 1.0 ;
		min relaxation   : 0.01 ;
		tolerance switch : 1e-4 ;
		algorithm        : Newton ;
		coupling         : fully coupled ;
		watchdog window  : 8 ;
	}

	timestep
	{
		initial timestep       : 5 ms ;
		minimum timestep       : 0.1 ns ;
		maximum timestep       : 50 ms ;
		simulation time        : 10 s ;
		adapt timestep         : true ;
		save every             : 25 ms ;
		anderson stabilization : on ;
		method                 : bdf5 ;

	}
}


initial conditions
{
	temperature : 77 K ;
}


materials
{
	ybco
	{
		builtin          : ybco ;
		file             : sp-ap.hdf5 ;
		resistivity type : piecewise ;
	}

	copper
	{
		builtin : copper ;
		RRR     : 50 ;
	}

	silver
	{
		builtin : silver ;
		RRR     : 10 ;
	}
	solder
	{
		builtin            : Pb38Sn62 ;
		RRR                : 1.5 ;
		density correction : 0.044 ;
	}
	hastelloy
	{
		builtin : hastelloy ;
	}

	buffer
	{
		builtin : magnesia ;
	}
}

layers : tape
{
	copper    : 20 mum ;
	silver    : 2 mum ;
	ybco      : 1.6 mum ;
	buffer    : 0.2 mum ;
	hastelloy : 50 mum ;
	silver    : 1.8 mum ;
	copper    : 20 mum ;
}

homology
{
	algorithm : generalized pellikka ;
}


topology
{
	thinshell : tape
	{
		edge coating : on ;
		sidesets     : -5,-6,7:20 ;
	}

	air
	{
		block : 1 ;
	}
	conductor
	{
		blocks   : 2:8 ;
		material : solder ;
	}
	curves
	{
		// front, z = 0
		1  : 5 @ 49 ;    // tape 1, left
		2  : 6 @ 49 ;    // tape 1, right
		3  : 7 @ 42 ;    // tape 2, left
		4  : 8 @ 42 ;    // tape 2, right
		5  : 9 @ 43 ;    // tape 3, left
		6  : 10 @ 43 ;   // tape 3, right
		7  : 11 @ 44 ;   // tape 4, left
		8  : 12 @ 44 ;   // tape 4, right
		9  : 13 @ 45 ;   // tape 5, left
		10 : 14 @ 45 ;   // tape 5, right
		11 : 15 @ 46 ;   // tape 6, left
		12 : 16 @ 46 ;   // tape 6, right
		13 : 17 @ 47 ;   // tape 7, left
		14 : 18 @ 47 ;   // tape 7, right
		15 : 19 @ 48 ;   // tape 8, left
		16 : 20 @ 48 ;   // tape 8, right

		// back, z = 10 mm  ( = domain length )
		17 : 5 @ 50 ;    // tape 1, left
		18 : 6 @ 50 ;    // tape 1, right
		19 : 7 @ 28 ;    // tape 2, left
		20 : 8 @ 28 ;    // tape 2, right
		21 : 9 @ 29 ;    // tape 3, left
		22 : 10 @ 29 ;   // tape 3, right
		23 : 11 @ 30 ;   // tape 4, left
		24 : 12 @ 30 ;   // tape 4, right
		25 : 13 @ 31 ;   // tape 5, left
		26 : 14 @ 31 ;   // tape 5, right
		27 : 15 @ 32 ;   // tape 6, left
		28 : 16 @ 32 ;   // tape 6, right
		29 : 17 @ 33 ;   // tape 7, left
		30 : 18 @ 33 ;   // tape 7, right
		31 : 19 @ 34 ;   // tape 8, left
		32 : 20 @ 34 ;   // tape 8, right
	}

	periodic
	{
		source : 11, 13, 53 ;
		target : 14, 16, 56 ;
	}
}

boundary conditions
{
	current
	{
		input terminals  : [42:48] ;   // solder end faces at z = 0
		output terminals : [28:34] ;   // solder end faces at z = domainLength
		type             : sigmoid ;
		amplitude        : 2 kA ;
		period           : 10 s ;
		offset           : 0 s ;
		fuzzyness        : 1e-4 ;
	}
}
