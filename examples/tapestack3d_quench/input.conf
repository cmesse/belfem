//---------------------------------------------------------------
// BELFEM INPUTFILE
// Berkeley Lab
//---------------------------------------------------------------
//
//  tapestack3d_quench -- eight soldered REBCO tapes in parallel, driven
//  into a quench.  The geometry is the same as in examples/tapestack3d;
//  what differs is the drive: instead of a prescribed sigmoid, the
//  transport current and a local Ic defect come from a user plugin
//  ( src/build/userdefect.so ), so the two share one time program
//  ( src/ramps.hpp ).  The current ramps at 200 A/s throughout; at 3 s a
//  defect switches on in the topmost tape, the solder redistributes that
//  tape's share, and the continuing ramp drives the stack out of margin.
//
//  Mesh the geometry first, then build the plugin before running:
//      gmsh -3 tapestack3d.geo -o tapestack3d.msh
//      cd src && mkdir -p build && cd build
//      cmake -DBELFEM_DIR=/path/to/belfem .. && make
//---------------------------------------------------------------

mesh
{
	file : tapestack3d.msh ;
	unit : mm ;               // geometry is written in mm
}

solver
{

	linear magnetic
	{
		//  MUMPS: robust for the h-phi system of a soldered stack.  The
		//  conditioning estimate is switched off here -- it costs a
		//  solve per factorization and this deck takes many steps.
		library              : mumps ;
		compute conditioning : off ;
		compression scheme   : off ;
		relative tolerance   : 1e-10 ;   // for PETSC
	}

	nonlinear magnetic
	{
		//  Tighter than the parent deck ( 1e-7 ): current sharing
		//  between eight tapes is the quantity of interest here, and a
		//  loose exit test leaves it under-resolved.
		tolerance         : 1e-9 ;
		max iterations    : 30 ;
		target iterations : 6 ;          // step controller aims for this
		min relaxation    : 0.01 ;
		algorithm         : Newton ;
		watchdog window   : 8 ;

		//  Optional stabilizers, both off.  Switch them on only with a
		//  reason -- see doc/input_file_reference.md.
		//coulomb gauge penalty
		// {
		//     chi : 1e-4 ;
		//  }

		//nitsche ghost penalty
		//{
		//    eta   : 4 ;
		//    k_reg : 1e-3 Ohm*m ;
		// }
	}

	linear thermal
	{
		library              : petsc ;
		compute conditioning : off ;
		preconditioner       : asm ;
	}

	nonlinear thermal
	{
		tolerance        : 1e-9 ;
		max iterations   : 15 ;
		min iterations   : 2 ;
		max relaxation   : 1.0 ;
		min relaxation   : 0.01 ;
		tolerance switch : 1e-4 ;
		algorithm        : Newton ;
		coupling         : fully coupled ;   // h-phi and T solved together
		watchdog window  : 8 ;
	}

	timestep
	{
		//  50 ms carries the ramp cheaply; the controller cuts the step
		//  by orders of magnitude once the hot spot appears, which is
		//  what the 0.1 ns floor is for.
		initial timestep       : 50 ms ;
		minimum timestep       : 0.1 ns ;
		maximum timestep       : 50 ms ;
		simulation time        : 10 s ;   // 2000 A at 200 A/s
		adapt timestep         : true ;
		save every             : 50 ms ;
		anderson stabilization : on ;
		method                 : bdf5 ;
	}
}


initial conditions
{
	temperature : 77 K ;      // liquid nitrogen bath
}


materials
{
	ybco
	{
		builtin          : ybco ;
		file             : sp-ap.hdf5 ;   // measured jc( T, B, theta ), found in share/material
		resistivity type : piecewise ;

		//  The local Ic degradation.  my_defect() in src/defect.cpp
		//  returns the jc multiplier at ( x, y, z, t ): a smoothed disk
		//  of radius 1.5 mm on the topmost tape only, switching on
		//  around t = 3 s and reaching 10 % of jc at its center.
		defect
		{
			file  : src/build/userdefect.so ;
			label : MyDefect ;
		}
	}

	copper
	{
		builtin : copper ;
		RRR     : 50 ;        // builds Copper_RRR50.hdf5 on first run
	}

	silver
	{
		builtin : silver ;
		RRR     : 10 ;
	}
	solder
	{
		//  The solder is what makes this a stack rather than eight
		//  independent tapes: it is the path the defected tape sheds
		//  its current through.
		builtin            : Pb38Sn62 ;
		RRR                : 1.5 ;
		density correction : 0.044 ;
	}
	hastelloy
	{
		builtin : hastelloy ;
	}

	buffer
	{
		builtin : magnesia ;
	}
}

//  Layer stack of one tape, outside in.  Total 95.6 um; the 1.6 um ybco
//  layer is the one the defect and the jc table act on.
layers : tape
{
	copper    : 20 mum ;
	silver    : 2 mum ;
	ybco      : 1.6 mum ;
	buffer    : 0.2 mum ;
	hastelloy : 50 mum ;
	silver    : 1.8 mum ;
	copper    : 20 mum ;
}

homology
{
	algorithm : generalized pellikka ;
}


topology
{
	thinshell : tape
	{
		//  No side connector walls on the tape edges -- the current
		//  sharing of interest here goes through the solder, not around
		//  the tape edges.  Signs select the jc lobe; keep them.
		edge coating : off ;
		sidesets     : -5,-6,7:20 ;
	}

	air
	{
		block : 1 ;
	}
	conductor
	{
		blocks   : 2:8 ;      // the seven solder volumes between the tapes
		material : solder ;
	}

	//  Tape edge curves, printed by `gmsh -0 tapestack3d.geo`.
	//  Read as  <curve id> : <sideset> @ <vertex> .
	curves
	{
		// front, z = 0
		1  : 5 @ 49 ;    // tape 1, left
		2  : 6 @ 49 ;    // tape 1, right
		3  : 7 @ 42 ;    // tape 2, left
		4  : 8 @ 42 ;    // tape 2, right
		5  : 9 @ 43 ;    // tape 3, left
		6  : 10 @ 43 ;   // tape 3, right
		7  : 11 @ 44 ;   // tape 4, left
		8  : 12 @ 44 ;   // tape 4, right
		9  : 13 @ 45 ;   // tape 5, left
		10 : 14 @ 45 ;   // tape 5, right
		11 : 15 @ 46 ;   // tape 6, left
		12 : 16 @ 46 ;   // tape 6, right
		13 : 17 @ 47 ;   // tape 7, left
		14 : 18 @ 47 ;   // tape 7, right
		15 : 19 @ 48 ;   // tape 8, left
		16 : 20 @ 48 ;   // tape 8, right

		// back, z = 10 mm  ( = domain length )
		17 : 5 @ 50 ;    // tape 1, left
		18 : 6 @ 50 ;    // tape 1, right
		19 : 7 @ 28 ;    // tape 2, left
		20 : 8 @ 28 ;    // tape 2, right
		21 : 9 @ 29 ;    // tape 3, left
		22 : 10 @ 29 ;   // tape 3, right
		23 : 11 @ 30 ;   // tape 4, left
		24 : 12 @ 30 ;   // tape 4, right
		25 : 13 @ 31 ;   // tape 5, left
		26 : 14 @ 31 ;   // tape 5, right
		27 : 15 @ 32 ;   // tape 6, left
		28 : 16 @ 32 ;   // tape 6, right
		29 : 17 @ 33 ;   // tape 7, left
		30 : 18 @ 33 ;   // tape 7, right
		31 : 19 @ 34 ;   // tape 8, left
		32 : 20 @ 34 ;   // tape 8, right
	}

	//  The two end planes are identified, so the 10 mm domain models an
	//  infinitely long stack.  The entries name VERTICES, three per plane,
	//  not collinear -- also printed by `gmsh -0`.
	periodic
	{
		source : 11, 13, 53 ;
		target : 14, 16, 56 ;
	}
}

boundary conditions
{
	current
	{
		input terminals  : [42:48] ;   // solder end faces at z = 0
		output terminals : [28:34] ;   // solder end faces at z = domainLength

		//  One bracket = one condition: the soldered stack is a single
		//  conductor, so the TOTAL current of all eight tapes is
		//  prescribed here.  my_current() in src/current.cpp supplies
		//  it -- a 200 A/s linear ramp, capped at 2500 A.  A
		//  `userdefined` source takes no `amplitude`; the dimension
		//  comes from `units`.
		type  : userdefined ;
		units : A ;
		file  : src/build/userdefect.so ;
		label : MyCurrent ;
	}
}
