mesh
{
	file : undulator.msh ;
	unit : m ;
}

solver
{
	linear
	{
		library : strumpack ;
	}

	nonlinear
	{
		tolerance         : 1e-6 ;
		max iterations    : 100 ;
		target iterations : 50 ;
		algorithm         : Picard ;
	}

	timestep
	{
		initial timestep       : 0.01 s ;
		maximum timestep       : 10 s ;
		simulation time        : 1200 s ;
		adapt timestep         : true ;
		save every             : 10 s ;
		anderson stabilization : false ;
		method                 : bdf1 ;
	}
}


